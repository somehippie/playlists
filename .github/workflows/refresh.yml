name: Refresh playlist data

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, early morning Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/playlists.json"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/refresh.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playlists.json
          git commit -m "Refresh playlist data"
          git push
