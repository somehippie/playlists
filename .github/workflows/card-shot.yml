name: Card screenshot (temporary)
on:
  push:
    branches: [card-shot]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Take the screenshots
        run: |
          python -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          mkdir -p shots
          python .github/card_shot.py
          ls -la shots
      - name: Save them on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shots
          git commit -m "Card screenshots"
          git push
